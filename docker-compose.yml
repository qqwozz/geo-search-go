services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: geosearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - nlp
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geosearch?sslmode=disable
      REDIS_URL: redis://redis:6379
      NLP_SERVICE_URL: http://nlp:8000
      CORS_ORIGIN: http://localhost:3000
      PORT: "8080"

  nlp:
    build: ./nlp
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
