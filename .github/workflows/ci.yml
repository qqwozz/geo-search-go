name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (echo "Files need formatting:" && gofmt -l . && exit 1)

      - name: Test
        run: go test ./... -v -count=1 -race

  nlp-test:
    name: NLP Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r nlp/requirements.txt

      - name: Test
        run: cd nlp && python -m pytest tests/ -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, nlp-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t geo-search-api .

      - name: Build NLP image
        run: docker build -t geo-search-nlp ./nlp

      - name: Build Frontend image
        run: docker build -t geo-search-frontend ./frontend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
